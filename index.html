<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Claudia & Andrés - 25 Aniversario</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600&family=Pinyon+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-cream: #F8F6F0; 
            --text-dark: #2C352D; 
            --accent-green: #768973; 
            --dark-green: #374A3A; 
            --accent-gold: #B59B6D; 
            --card-bg: #FFFFFF;
            --bg-outer: #EAE6DC; /* Color de fondo exterior para pantallas grandes */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        
        /* El fondo exterior solo se apreciará en pantallas de escritorio */
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-outer); 
            color: var(--text-dark); 
            overflow-x: hidden;
            font-weight: 300;
            display: flex;
            justify-content: center;
        }

        /* --- MARCO CONTENEDOR PRINCIPAL --- */
        .main-wrapper {
            width: 100%;
            max-width: 600px; /* Ancho ideal tipo tarjeta vertical para escritorio */
            background-color: var(--bg-cream);
            background-image: url("https://www.transparenttextures.com/patterns/cream-paper.png");
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.08); /* Sombra elegante en los lados en PC */
            position: relative;
            min-height: 100vh;
        }

        /* Líneas de marco decorativo refinado a los lados (estilo paspartú) */
        .main-wrapper::before {
            content: '';
            position: fixed;
            top: 15px;
            bottom: 15px;
            left: calc(50% - 285px);
            width: 570px;
            border: 1px solid rgba(181, 155, 109, 0.2);
            pointer-events: none;
            z-index: 999;
        }

        h1, h2, h3, h4 { font-family: 'Playfair Display', serif; font-weight: 500; color: var(--dark-green); }
        .script-font { font-family: 'Pinyon Script', cursive; font-weight: 400; }

        /* --- PANTALLA DE APERTURA (SOBRE INTERACTIVO) --- */
        #envelope-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background-color: rgba(248, 246, 240, 0.75); /* Crema semitransparente */
            backdrop-filter: blur(5px); /* Efecto difuminado tenue al fondo */
            -webkit-backdrop-filter: blur(5px);
            z-index: 9999; display: flex; flex-direction: column; 
            align-items: center; justify-content: center;
            transition: opacity 1.2s ease, backdrop-filter 1.2s ease;
        }

        .env-container {
            position: relative;
            width: 340px;
            height: 220px;
            perspective: 1200px;
            margin-bottom: 25px;
            transition: transform 0.3s ease;
        }

        .envelope {
            position: relative;
            width: 100%;
            height: 100%;
            box-shadow: 0 25px 55px rgba(0,0,0,0.22);
            border-radius: 6px;
            cursor: pointer;
        }

        .env-inside {
            position: absolute;
            inset: 0;
            background-color: #1a2e1e;
            background-image: url("https://www.transparenttextures.com/patterns/floral.png");
            border-radius: 6px;
            z-index: 1;
        }

        .env-card {
            position: absolute;
            top: 12px;
            left: 15px;
            width: 310px;
            height: 196px;
            background: #FCFAF5;
            background-image: url("https://www.transparenttextures.com/patterns/cream-paper.png");
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .card-border {
            border: 1px solid rgba(118, 137, 115, 0.35);
            padding: 15px 10px;
            width: calc(100% - 16px);
            height: calc(100% - 16px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .card-subtitle {
            font-size: 0.65rem;
            letter-spacing: 3px;
            color: var(--accent-gold);
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
            font-weight: 500;
        }

        .card-title {
            font-size: 2.8rem;
            color: var(--dark-green);
            margin: 4px 0;
            line-height: 1.1;
        }

        .card-line {
            width: 40px;
            height: 1px;
            background: var(--accent-gold);
            margin: 6px 0;
        }

        .card-doc {
            font-size: 0.65rem;
            letter-spacing: 2px;
            color: var(--accent-green);
            font-family: 'Inter', sans-serif;
            font-weight: 500;
        }

        .env-pocket {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
            filter: url(#paper-texture) drop-shadow(0 -2px 5px rgba(0,0,0,0.1));
        }

        .env-flap-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 140px;
            z-index: 4;
            transform-origin: top center;
            transition: transform 0.8s ease-in-out;
        }
